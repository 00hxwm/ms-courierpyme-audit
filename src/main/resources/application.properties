spring.application.name=ms-courierpyme-audit
server.port=8086

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ENTRA_ISSUER_URI}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=audit-service

app.kafka.topic.shipments-events=shipments.events
app.kafka.topic.shipments-events-dlt=shipments.events.DLT
app.kafka.topic.audit-timeline=audit.timeline
app.kafka.consumer.concurrency=3
app.kafka.retry.max-retries=3
app.kafka.retry.backoff-ms=2000
